[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-agent-runtime"
version = "0.1.0a2"
description = "A small, inspectable runtime for durable agent tool execution, recovery, cancellation, and evidence."
readme = "PRODUCT.md"
requires-python = ">=3.13"
dependencies = [
  "SQLAlchemy>=2.0,<3",
]
license = "MIT"
authors = [
  { name = "RuiCore" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/ruicore/reliable-agent-runtime"
Repository = "https://github.com/ruicore/reliable-agent-runtime"
Issues = "https://github.com/ruicore/reliable-agent-runtime/issues"

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
